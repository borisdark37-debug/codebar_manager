services:
  - type: web
    name: codebar-manager-backend
    runtime: docker
    dockerfilePath: ./codebar-manager-back/Dockerfile
    dockerContext: ./codebar-manager-back
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: CodeBarManager
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://codebar-manager-backend.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: AUTO_MIGRATE
        value: "true"
      - key: APP_KEY
        generateValue: true
