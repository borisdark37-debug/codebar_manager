name: codebar_manager_app
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.1+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  image: ^4.3.0

  # Identifiants
  uuid: ^4.4.0

  # Codes-barres
  barcode: ^2.2.7

  # Export
  archive: ^3.6.1
  file_saver: ^0.2.12
  share_plus: ^9.0.0

  # Notifications
  flutter_local_notifications: ^17.1.2

  # HTTP (préparé pour la Phase 6)
  dio: ^5.4.3

  # Internationalization
  intl: ^0.19.0

  # Hachage de mot de passe (auth locale super_admin)
  crypto: ^3.0.3

  # Scanner de codes-barres / QR codes
  mobile_scanner: ^7.3.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  flutter_svg: ^2.3.0
  file_picker: ^8.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
